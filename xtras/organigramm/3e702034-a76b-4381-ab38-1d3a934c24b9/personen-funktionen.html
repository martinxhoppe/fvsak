<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Geschützter Bereich</title>
<style>
  :root {
    --bg: #f6f3ee;
    --panel: #fffdf9;
    --ink: #1f2430;
    --muted: #6b6f7a;
    --line: #e3ddd2;
    --accent: #e8643c;
    --accent-soft: #fde4da;
    --link: #2f6fb1;
    --link-soft: #dceaf7;
    --dim: 0.28;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c; --panel: #1d2027; --ink: #e9e6df; --muted: #9a9ea8;
      --line: #2e323b; --accent: #f07a52; --accent-soft: #3d2620;
      --link: #6aa5e0; --link-soft: #1d2d3e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Passwort ---------- */
  #gate {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
  }
  #gate form {
    width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px;
  }
  #gate h1 { font-size: 18px; margin: 0 0 6px; }
  #gate p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  #gate input {
    width: 100%; font: inherit; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #gate input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #gate button {
    margin-top: 12px; width: 100%; font: inherit; font-weight: 600;
    padding: 11px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  #gate button:disabled { opacity: .6; cursor: wait; }
  #err { color: var(--accent); font-size: 14px; min-height: 1.4em; margin-top: 10px; }

  /* ---------- Ansicht ---------- */
  #app { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; gap: 8px; margin: 16px 0 18px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1 1 220px; font: inherit; padding: 9px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .toolbar button {
    font: inherit; padding: 9px 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }

  .seg { display: flex; align-items: center; gap: 0; }
  .seg span { color: var(--muted); font-size: 13px; margin-right: 8px; }
  .toolbar .seg button { border-radius: 0; margin-left: -1px; }
  .toolbar .seg button:first-of-type { border-radius: 9px 0 0 9px; margin-left: 0; }
  .toolbar .seg button:last-of-type { border-radius: 0 9px 9px 0; }
  .toolbar .seg button[aria-pressed="true"] {
    background: var(--ink); color: var(--panel); border-color: var(--ink);
  }

  #clr {
    position: absolute; z-index: 5; display: none; top: 0; left: 0;
    font: inherit; font-size: 13px; font-weight: 600; line-height: 1;
    padding: 6px 11px; border-radius: 99px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #clr.show { display: block; }
  #clr:hover { filter: brightness(1.08); }

  #board {
    position: relative; display: grid;
    grid-template-columns: minmax(0, 1fr) 160px minmax(0, 1.25fr);
  }
  #wires {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .col h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
  }
  .col.left { grid-column: 1; }
  .col.right { grid-column: 3; }
  .cat { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .cat:first-of-type { margin-top: 0; }

  .item {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; margin-bottom: 6px;
    cursor: pointer; user-select: none;
    transition: opacity .15s, background .15s, border-color .15s;
  }
  .left .item { justify-content: space-between; }
  .item .n {
    font-size: 11px; color: var(--muted); background: var(--bg);
    border-radius: 99px; padding: 1px 7px; flex: none;
  }
  .item .t { min-width: 0; overflow-wrap: anywhere; }

  #board.active .item { opacity: var(--dim); }
  #board.active .item.on, #board.active .item.rel { opacity: 1; }
  .item.on { background: var(--accent-soft); border-color: var(--accent); }
  .item.rel { background: var(--link-soft); border-color: var(--link); }
  .item.hide, .item.gone { display: none; }

  #wires path { fill: none; stroke: var(--link); stroke-width: 1.6; }
  #wires .head { fill: var(--link); }

  @media (max-width: 640px) {
    body { font-size: 13px; }
    #app { padding: 16px 10px 48px; }
    header h1 { font-size: 18px; }
    #board { grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1.2fr); }
    .item { padding: 6px 7px; gap: 5px; border-radius: 7px; }
    .item .n { display: none; }
    .col h2 { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="gate">
  <form id="pwform" autocomplete="off">
    <h1>Geschützter Bereich</h1>
    <p>Bitte Passwort eingeben.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" required>
    <button id="go" type="submit">Öffnen</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<div id="app">
  <header>
    <h1 id="ttl"></h1>
    <p id="sub"></p>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Name suchen …" aria-label="Name suchen">
    <div class="seg" role="group" aria-label="Personen sortieren">
      <span>Sortieren:</span>
      <button type="button" data-sort="count" aria-pressed="true">Anzahl Funktionen</button>
      <button type="button" data-sort="name" aria-pressed="false">Name</button>
    </div>
  </div>
  <div id="board">
    <button id="clr" type="button">✕ Auswahl aufheben</button>
    <svg id="wires" aria-hidden="true">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="head" d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="g"></g>
    </svg>
    <div class="col left"><h2>Personen</h2><div id="pl"></div></div>
    <div class="col right"><h2>Funktionen</h2><div id="fl"></div></div>
  </div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const [saltB, ivB, ctB, iterS] = PAYLOAD.split(".");
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(saltB), iterations: parseInt(iterS, 10), hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ivB) }, key, b64(ctB));
  return JSON.parse(new TextDecoder().decode(pt));
}

document.getElementById("pwform").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = "";
  if (!window.crypto || !crypto.subtle) {
    err.textContent = "Dieser Browser unterstützt die Entschlüsselung nicht (HTTPS erforderlich).";
    return;
  }
  btn.disabled = true; btn.textContent = "Entschlüssele …";
  try {
    const data = await decrypt(document.getElementById("pw").value);
    document.getElementById("pw").value = "";
    document.getElementById("gate").remove();
    render(data);
  } catch (_) {
    err.textContent = "Falsches Passwort.";
    btn.disabled = false; btn.textContent = "Öffnen";
  }
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render(D) {
  const app = document.getElementById("app");
  app.style.display = "block";
  document.getElementById("ttl").textContent = D.title;
  document.getElementById("sub").textContent = D.subtitle;

  const board = document.getElementById("board");
  const pl = document.getElementById("pl"), fl = document.getElementById("fl");
  const g = document.getElementById("g"), svg = document.getElementById("wires");
  const pEls = {}, fEls = {}, fToP = {};

  D.functions.forEach(f => fToP[f.id] = []);
  D.persons.forEach((p, i) => p.f.forEach(fid => fToP[fid].push(i)));

  D.persons.forEach((p, i) => {
    const it = el("div", "item");
    it.tabIndex = 0;
    it.append(el("span", "t", p.name), el("span", "n", p.f.length));
    it.dataset.k = "p" + i;
    pEls[i] = it; pl.append(it);
  });
  D.categories.forEach(([cid, label]) => {
    const fs = D.functions.filter(f => f.cat === cid);
    if (!fs.length) return;
    const h = el("div", "cat", label); fl.append(h);
    fs.forEach(f => {
      const it = el("div", "item");
      it.tabIndex = 0;
      it.append(el("span", "n", fToP[f.id].length), el("span", "t", f.label));
      it.dataset.k = "f" + f.id;
      it._cat = h;
      fEls[f.id] = it; fl.append(it);
    });
  });

  let sel = null;
  const current = () => sel;
  const catHeads = [...fl.querySelectorAll(".cat")];

  function updateCats() {
    catHeads.forEach(h => {
      let n = h.nextElementSibling, any = false;
      while (n && !n.classList.contains("cat")) {
        if (!n.classList.contains("hide") && !n.classList.contains("gone")) any = true;
        n = n.nextElementSibling;
      }
      h.style.display = any ? "" : "none";
    });
  }

  let srcShift = 0; // hält den gewählten Eintrag unter dem Mauszeiger

  function applyCollapse(anchorTop) {
    const all = Object.values(pEls).concat(Object.values(fEls));
    all.forEach(e => e.classList.remove("gone"));
    // Namenssuche: filtert nur Personen. Ist eine Funktion gewählt, werden alle ihre Personen gezeigt.
    const term = document.getElementById("q").value.trim().toLowerCase();
    const kk = current();
    const relP = kk && kk[0] === "f" ? new Set(fToP[kk.slice(1)]) : null;
    Object.entries(pEls).forEach(([i, e]) => {
      const hit = !term || D.persons[+i].name.toLowerCase().includes(term);
      e.classList.toggle("hide", !hit && !(relP && relP.has(+i)));
    });
    pl.style.marginTop = fl.style.marginTop = "0px";
    const k = current();
    if (!k) { srcShift = 0; updateCats(); return; }
    const fromLeft = k[0] === "p";
    const keep = new Set(links(k).map(([pe, fe]) => fromLeft ? fe : pe));
    Object.values(fromLeft ? fEls : pEls).forEach(e => { if (!keep.has(e)) e.classList.add("gone"); });
    updateCats();

    const src = fromLeft ? pEls[+k.slice(1)] : fEls[k.slice(1)];
    const srcList = fromLeft ? pl : fl, other = fromLeft ? fl : pl;

    // 1) Quellspalte: gewählten Eintrag an seiner bisherigen Bildschirmposition halten
    if (anchorTop != null) {
      const delta = src.getBoundingClientRect().top - anchorTop;
      srcShift = Math.max(0, -delta);
      if (delta > 0) window.scrollBy(0, delta);
    }
    srcList.style.marginTop = srcShift + "px";

    // 2) Gegenspalte: verbleibende Einträge auf Höhe des gewählten Eintrags zentrieren
    const vis = [...other.children].filter(e => e.offsetParent !== null);
    if (!vis.length) return;
    const s = src.getBoundingClientRect();
    const top = vis[0].getBoundingClientRect().top, bottom = vis[vis.length - 1].getBoundingClientRect().bottom;
    const want = (s.top + s.height / 2) - (bottom - top) / 2;
    other.style.marginTop = Math.max(0, want - top) + "px";
  }

  function select(k) {
    if (sel === k) return;
    let anchor = null;
    if (k) {
      const el0 = k[0] === "p" ? pEls[+k.slice(1)] : fEls[k.slice(1)];
      if (el0.offsetParent !== null) anchor = el0.getBoundingClientRect().top;
    }
    // Wechsel von einer Auswahl zu einem anderen Eintrag: Suchfilter zurücksetzen
    const qi = document.getElementById("q");
    if (k && sel && k !== sel && qi.value) qi.value = "";
    sel = k; applyCollapse(anchor); draw();
  }

  function links(k) {
    if (!k) return [];
    if (k[0] === "p") { const i = +k.slice(1); return D.persons[i].f.map(fid => [pEls[i], fEls[fid]]); }
    const fid = k.slice(1); return fToP[fid].map(i => [pEls[i], fEls[fid]]);
  }

  const clr = document.getElementById("clr");
  function positionBtn() {
    const k = current();
    clr.classList.toggle("show", !!k);
    if (!k) return;
    const fromLeft = k[0] === "p";
    const src = fromLeft ? pEls[+k.slice(1)] : fEls[k.slice(1)];
    if (src.offsetParent === null) { clr.classList.remove("show"); return; }
    const box = board.getBoundingClientRect(), r = src.getBoundingClientRect();
    const w = clr.offsetWidth, h = clr.offsetHeight;
    const x = fromLeft ? r.left - box.left : r.right - box.left - w;
    let y = r.top - box.top - h - 5;
    const vTop = -box.top + 8, vBot = window.innerHeight - box.top - h - 8;
    y = Math.min(Math.max(y, vTop), vBot);
    clr.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }

  function draw() {
    positionBtnSoon();
    g.replaceChildren();
    Object.values(pEls).concat(Object.values(fEls)).forEach(e => e.classList.remove("on", "rel"));
    const k = current();
    board.classList.toggle("active", !!k);
    if (!k) return;
    const src = k[0] === "p" ? pEls[+k.slice(1)] : fEls[k.slice(1)];
    src.classList.add("on");
    const box = board.getBoundingClientRect();
    const fromLeft = k[0] === "p";
    links(k).forEach(([pe, fe]) => {
      (fromLeft ? fe : pe).classList.add("rel");
      if (pe.classList.contains("hide") || fe.classList.contains("hide")) return;
      const a = pe.getBoundingClientRect(), b = fe.getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top;
      const x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const dx = Math.max(24, (x2 - x1) * 0.5);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = fromLeft
        ? `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2 - 1},${y2}`
        : `M${x2},${y2} C${x2 - dx},${y2} ${x1 + dx},${y1} ${x1 + 1},${y1}`;
      path.setAttribute("d", d);
      path.setAttribute("marker-end", "url(#arr)");
      g.append(path);
    });
  }

  // Maus: Überfahren wählt aus (bleibt stehen). Touch/Klick: Antippen wählt aus.
  // kurze Verweilzeit, damit diagonales Überstreichen auf dem Weg zur anderen Spalte nichts umschaltet
  let hoverTimer = 0, quiet = null; // nach dem Aufheben erst wieder reagieren, wenn die Maus bewegt wird
  document.addEventListener("pointermove", e => {
    if (quiet && Math.hypot(e.clientX - quiet[0], e.clientY - quiet[1]) > 4) quiet = null;
  });
  board.addEventListener("pointerover", e => {
    if (e.pointerType === "touch" || quiet) return;
    const it = e.target.closest(".item"); if (!it) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { if (!quiet) select(it.dataset.k); }, 180);
  });
  board.addEventListener("pointerout", e => {
    if (e.pointerType === "touch") return;
    const it = e.target.closest(".item");
    if (it && !(e.relatedTarget && it.contains(e.relatedTarget))) clearTimeout(hoverTimer);
  });
  document.addEventListener("click", e => {
    if (e.target.closest(".toolbar")) return;
    const it = e.target.closest(".item");
    if (!it) { clearTimeout(hoverTimer); quiet = [e.clientX, e.clientY]; }
    select(it ? it.dataset.k : null);
  });
  board.addEventListener("keydown", e => {
    const it = e.target.closest(".item");
    if (it && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(sel === it.dataset.k ? null : it.dataset.k); }
    if (e.key === "Escape") select(null);
  });
  document.getElementById("clr").addEventListener("click", () => select(null));

  const coll = new Intl.Collator("de");
  const sorters = {
    count: (a, b) => D.persons[b].f.length - D.persons[a].f.length || coll.compare(D.persons[a].s, D.persons[b].s),
    name: (a, b) => coll.compare(D.persons[a].s, D.persons[b].s),
  };
  document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === btn ? "true" : "false"));
    Object.keys(pEls).map(Number).sort(sorters[btn.dataset.sort]).forEach(i => pl.append(pEls[i]));
    applyCollapse(); draw();
  }));

  const q = document.getElementById("q");
  q.addEventListener("input", () => {
    if (sel) { sel = null; srcShift = 0; }
    applyCollapse(); draw();
  });

  let braf = 0;
  function positionBtnSoon() { cancelAnimationFrame(braf); braf = requestAnimationFrame(positionBtn); }
  window.addEventListener("scroll", positionBtnSoon, { passive: true });

  let raf = 0;
  const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { applyCollapse(); draw(); }); };
  window.addEventListener("resize", redraw);
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(board);
}
</script>
